---
# A Cloudflare Pages preview for every PR, at a stable per-PR URL
# (https://pr-<number>.aura-2q7.pages.dev), shown on the PR as this job's
# "preview" deployment. The `aura` project is a direct-upload project whose
# production branch is `main`, so every upload here is a preview; production
# stays on GitHub Pages (deploy.yml) and the homelab image (image.yml).
#
# Needs one repository secret: CLOUDFLARE_API_TOKEN, a token with
# "Account › Cloudflare Pages › Edit" on the account below.
name: PR preview (Cloudflare Pages)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  deployments: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: de11927c1b728c9897c960abbe336098
  PAGES_PROJECT: aura
  PAGES_SUBDOMAIN: aura-2q7.pages.dev

jobs:
  preview:
    # A fork's PR gets no secrets, so it can't deploy.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: https://pr-${{ github.event.pull_request.number }}.${{ env.PAGES_SUBDOMAIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # wrangler 4.x needs Node 22.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # Pages rejects files over 25 MiB: ONNX Runtime's jsep/asyncify wasm
      # builds (27–28 MB) don't fit. ml.worker.js notices before any model
      # download and loads the identical build from jsDelivr (lib/ort-files.js).
      - name: Prepare for Pages
        run: |
          cp deploy/pages/_headers public/_headers
          find public -type f -size +25M -print -delete

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npx --yes wrangler@4.156.2 pages deploy public \
            --project-name "$PAGES_PROJECT" \
            --branch "pr-$PR_NUMBER" \
            --commit-hash "$HEAD_SHA"
