name: Push small CPU vision models to Replicate

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/benchmarkheaven-aura-integration-10i1b3
    paths:
      - deploy/replicate/small-models/**
      - .github/workflows/replicate-small-models.yml

permissions:
  contents: read

concurrency:
  group: replicate-small-models
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for the Replicate token
        id: token
        env:
          REPLICATE_TOKEN: ${{ secrets.REPLICATE_CLI_AUTH_TOKEN }}
        run: |
          if [ -z "$REPLICATE_TOKEN" ]; then
            echo "::notice::REPLICATE_CLI_AUTH_TOKEN is not set; skipping the push."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Cog
        if: steps.token.outputs.present == 'true'
        uses: replicate/setup-cog@8a5fea3c1818b6950dcf8027285f5a9b447c0c4a # v2.0.3
        with:
          token: ""
          cog-version: v0.23.0

      - name: Create public CPU models when using an API token
        if: steps.token.outputs.present == 'true'
        env:
          REPLICATE_TOKEN: ${{ secrets.REPLICATE_CLI_AUTH_TOKEN }}
        run: |
          if [[ "$REPLICATE_TOKEN" != r8_* ]]; then
            echo "::error::A Replicate API token (r8_...) is needed to create the public CPU models."
            echo "Create barakplasma/decider-2b-vision and barakplasma/qwen3-vl-2b as public models with CPU hardware, then rerun."
            exit 1
          fi
          for model in decider-2b-vision qwen3-vl-2b; do
            code=$(curl --silent --show-error --output /tmp/model.json --write-out '%{http_code}' \
              --header "Authorization: Bearer $REPLICATE_TOKEN" \
              "https://api.replicate.com/v1/models/barakplasma/$model")
            if [ "$code" = 200 ]; then
              continue
            fi
            if [ "$code" != 404 ]; then
              echo "::error::Could not inspect Replicate model barakplasma/$model (HTTP $code)."
              exit 1
            fi
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $REPLICATE_TOKEN" \
              --header "Content-Type: application/json" \
              --data "{\"owner\":\"barakplasma\",\"name\":\"$model\",\"visibility\":\"public\",\"hardware\":\"cpu\"}" \
              https://api.replicate.com/v1/models >/dev/null
          done

      - name: Log in to r8.im
        if: steps.token.outputs.present == 'true'
        env:
          REPLICATE_TOKEN: ${{ secrets.REPLICATE_CLI_AUTH_TOKEN }}
        run: |
          printf '%s' "$REPLICATE_TOKEN" | docker login r8.im --username barakplasma --password-stdin

      - name: Push decider-2b-vision
        if: steps.token.outputs.present == 'true'
        working-directory: deploy/replicate/small-models/decider-2b-vision
        run: cog push r8.im/barakplasma/decider-2b-vision

      - name: Push Qwen3-VL-2B
        if: steps.token.outputs.present == 'true'
        working-directory: deploy/replicate/small-models/qwen3-vl-2b
        run: cog push r8.im/barakplasma/qwen3-vl-2b
