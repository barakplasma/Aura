---
# Configuration file for MegaLinter
# See all available variables at https://megalinter.io/latest/config-file/

DISABLE_LINTERS:
  - SPELL_CSPELL

# public/assets is esbuild output (minified, code-split bundles + sourcemaps);
# public/aura.css is a build copy of src/aura.css. Don't lint generated files.
FILTER_REGEX_EXCLUDE: "(public/assets/|public/aura\\.css|\\.map$)"

# The repo uses semicolons throughout; Standard's default style forbids them.
# Prettier keeps the existing convention instead of forcing a repo-wide rewrite.
JAVASCRIPT_DEFAULT_STYLE: prettier

# Report findings without failing the job; the PR comment is the review surface.
DISABLE_ERRORS: true

# AI-generated fix suggestions on top of each linter finding.
LLM_ADVISOR_ENABLED: true
LLM_ADVISOR_LEVEL: ERROR
LLM_PROVIDER: anthropic
LLM_MODEL_NAME: claude-3-7-sonnet-latest

PRINT_ALPACA: false
