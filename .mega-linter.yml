---
# Configuration file for MegaLinter
# See all available variables at https://megalinter.io/latest/config-file/

DISABLE_LINTERS:
  - SPELL_CSPELL

# public/assets is esbuild output (minified, code-split bundles + sourcemaps);
# public/aura.css is a build copy of src/aura.css. Don't lint generated files.
FILTER_REGEX_EXCLUDE: "(public/assets/|public/aura\\.css|\\.map$)"

# package-lock.json embeds npm packages' funding URLs (e.g. Patreon,
# OpenCollective); those hosts 403 automated requests, which isn't a real
# dead link. Still JSON/lint-checked — just not link-checked.
SPELL_LYCHEE_FILTER_REGEX_EXCLUDE: "package-lock\\.json"

# The repo uses semicolons throughout; Standard's default style forbids them.
# Prettier keeps the existing convention instead of forcing a repo-wide rewrite.
JAVASCRIPT_DEFAULT_STYLE: prettier

# Report findings without failing the job; the PR comment is the review surface.
DISABLE_ERRORS: true

# AI-generated fix suggestions on top of each linter finding.
# Level WARNING, not the default ERROR: ERROR only analyzes linters whose own
# exit code is non-zero (blocking), but DISABLE_ERRORS above forces every
# linter's exit code to 0 — under ERROR the advisor would never have
# anything to analyze.
LLM_ADVISOR_ENABLED: true
LLM_ADVISOR_LEVEL: WARNING
# OpenRouter is OpenAI-compatible: LLM_PROVIDER: openai + OPENAI_BASE_URL
# pointed at OpenRouter, authenticated with OPENROUTER_API_KEY passed through
# as OPENAI_API_KEY in the workflow. openrouter/auto routes each request to
# a model OpenRouter judges suitable (and cheap) for it, rather than pinning
# one fixed model.
LLM_PROVIDER: openai
OPENAI_BASE_URL: https://openrouter.ai/api/v1
LLM_MODEL_NAME: openrouter/auto

# table-sections is already the default, but it's what makes the PR comment
# render per-linter detail sections (not just the summary table) — that's
# where the LLM Advisor attaches its fix suggestions. Set explicitly so it
# doesn't silently drift if the reporter's default ever changes.
REPORTERS_MARKDOWN_SUMMARY_TYPE: table-sections

PRINT_ALPACA: false
