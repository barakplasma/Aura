apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aura-relay
  namespace: {{ include "aura-relay.ns" . }}
  labels:
    {{- include "aura-relay.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: traefik-proxy
                port:
                  number: {{ .Values.traefik.port }}
