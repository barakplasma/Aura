# Upstream: Replicate's API, reached through Traefik as an ExternalName.
apiVersion: v1
kind: Service
metadata:
  name: replicate-api
  namespace: {{ include "aura-relay.ns" . }}
  labels:
    {{- include "aura-relay.labels" . | nindent 4 }}
spec:
  type: ExternalName
  externalName: {{ .Values.upstream.host }}
  ports:
    - name: https
      port: 443
---
# Upstream: Cloudflare's API, for Workers AI's Clef route only.
apiVersion: v1
kind: Service
metadata:
  name: cloudflare-api
  namespace: {{ include "aura-relay.ns" . }}
  labels:
    {{- include "aura-relay.labels" . | nindent 4 }}
spec:
  type: ExternalName
  externalName: {{ .Values.cloudflare.host }}
  ports:
    - name: https
      port: 443
---
# The cloudflare-tunnel Ingress targets this; Traefik owns the routing.
apiVersion: v1
kind: Service
metadata:
  name: traefik-proxy
  namespace: {{ include "aura-relay.ns" . }}
  labels:
    {{- include "aura-relay.labels" . | nindent 4 }}
spec:
  type: ExternalName
  externalName: {{ .Values.traefik.service }}
  ports:
    - name: web
      port: {{ .Values.traefik.port }}
