{{- $ns := include "aura-relay.ns" . -}}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: aura-relay-cors
  namespace: {{ $ns }}
spec:
  headers: # also answers CORS preflights itself
    accessControlAllowOriginList: [{{ .Values.auraOrigin | quote }}]
    accessControlAllowMethods: [GET, POST]
    accessControlAllowHeaders: [authorization, content-type, prefer]
    accessControlMaxAge: 600
    addVaryHeader: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: aura-relay-body-limit
  namespace: {{ $ns }}
spec:
  buffering:
    maxRequestBodyBytes: {{ .Values.maxRequestBodyBytes | int }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: aura-relay-ratelimit
  namespace: {{ $ns }}
spec:
  rateLimit:
    average: {{ .Values.rateLimit.average }}
    burst: {{ .Values.rateLimit.burst }}
    sourceCriterion:
      # Behind Cloudflare Tunnel every request arrives from cloudflared;
      # the end user's IP is only in this header.
      requestHeaderName: CF-Connecting-IP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: aura-relay
  namespace: {{ $ns }}
spec:
  entryPoints: [web] # TLS terminates at Cloudflare
  routes:
    - kind: Rule
      match: Host(`{{ .Values.host }}`) && Method(`OPTIONS`) && Header(`Origin`, `{{ .Values.auraOrigin }}`)
      middlewares:
        - name: aura-relay-cors
      services:
        - name: replicate-api
          port: 443
          scheme: https
          passHostHeader: false
    - kind: Rule
      match: Host(`{{ .Values.host }}`) && Header(`Origin`, `{{ .Values.auraOrigin }}`) && (Path(`/v1/predictions`) || PathPrefix(`/v1/predictions/`)) && HeaderRegexp(`Authorization`, `{{ .Values.upstream.tokenPattern }}`)
      middlewares:
        - name: aura-relay-cors
        - name: aura-relay-body-limit
        - name: aura-relay-ratelimit
      services:
        - name: replicate-api
          port: 443
          scheme: https
          passHostHeader: false
