# File-provider twin of chart/templates/traefik.yaml, for
# scripts/dev-relay-local.mjs: the same routers and middlewares, run by a
# real Traefik binary against a fake upstream. Keep the two in step.
# __HOST__, __ORIGIN__ and __UPSTREAM__ are filled in by the script.
http:
  middlewares:
    aura-relay-cors:
      headers:
        accessControlAllowOriginList: ["__ORIGIN__"]
        accessControlAllowMethods: [GET, POST]
        accessControlAllowHeaders: [authorization, content-type, prefer]
        accessControlMaxAge: 600
        addVaryHeader: true
    aura-relay-body-limit:
      buffering:
        maxRequestBodyBytes: 4000000
    aura-relay-ratelimit:
      rateLimit:
        average: 2
        burst: 10
        sourceCriterion:
          requestHeaderName: CF-Connecting-IP
  routers:
    aura-relay-preflight:
      entryPoints: [web]
      rule: Host(`__HOST__`) && Method(`OPTIONS`) && Header(`Origin`, `__ORIGIN__`)
      middlewares: [aura-relay-cors]
      service: replicate-api
    aura-relay:
      entryPoints: [web]
      rule: Host(`__HOST__`) && Header(`Origin`, `__ORIGIN__`) && (Path(`/v1/predictions`) || PathPrefix(`/v1/predictions/`)) && HeaderRegexp(`Authorization`, `^Bearer r8_[A-Za-z0-9]+$`)
      middlewares:
        [aura-relay-cors, aura-relay-body-limit, aura-relay-ratelimit]
      service: replicate-api
  services:
    replicate-api:
      loadBalancer:
        passHostHeader: false
        servers:
          - url: "__UPSTREAM__"
