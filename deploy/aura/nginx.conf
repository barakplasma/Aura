# Static hosting for the Aura PWA. The service worker stamps COOP/COEP on
# navigations itself (scripts/sw-template.js); the headers here make the very
# first load isolated too, and let the shell be served by any proxy unchanged.
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Cross-Origin-Embedder-Policy require-corp always;
  add_header Cross-Origin-Resource-Policy same-origin always;

  # The update path: a browser must always ask the network whether a new worker
  # exists, or "automatic updates" would wait on a stale cached sw.js. The
  # shell and manifest are revalidated for the same reason.
  location = /sw.js { add_header Cache-Control "no-cache"; include /etc/nginx/conf.d/isolation.inc; }
  location = /index.html { add_header Cache-Control "no-cache"; include /etc/nginx/conf.d/isolation.inc; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; include /etc/nginx/conf.d/isolation.inc; }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /healthz { access_log off; return 200 "ok\n"; }
}
