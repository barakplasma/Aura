# Jev-Omni (akhilaaa3/Jev-Omni, Apache-2.0) as a public Replicate model:
# r8.im/barakplasma/jev-omni. Public so every caller pays for their own
# runs with their own token (BYOK) - see docs/PRD-decision-engine.md.
# The ~24 GB checkpoint is not baked in: a layer that size is rejected by
# r8.im (413 Payload Too Large). The first prediction fetches it with pget so
# downloader output and heartbeat diagnostics appear in that prediction's logs.
build:
  gpu: true
  # Cog 0.23 has no CUDA mapping for torch 2.14; pin it to match the
  # +cu126 wheels in requirements.txt.
  cuda: "12.6"
  python_version: "3.12"
  python_requirements: requirements.txt
  run:
    - curl -fsSL -o /usr/local/bin/pget https://github.com/replicate/pget/releases/download/v0.8.2/pget_linux_x86_64
    - chmod +x /usr/local/bin/pget
run: "predict.py:Predictor"
